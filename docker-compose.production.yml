services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      API_PORT: 8081
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set frontend origins}
    expose: ['8081']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8081/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set website URL}
        NEXT_PUBLIC_CUSTOMER_URL: ${NEXT_PUBLIC_CUSTOMER_URL:?set customer URL}
        SEO_ALLOW_INDEXING: ${SEO_ALLOW_INDEXING:-false}
    expose: ['5185']
    restart: unless-stopped
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set public API URL}
    expose: ['8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  customer:
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?set public API URL}
    expose: ['8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health >/dev/null']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
